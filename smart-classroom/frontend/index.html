<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Nyx — Smart Classroom Assistant</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="layout">

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <span>💬 Chats</span>
        <button class="new-chat-btn" onclick="newChat()" title="New Chat">＋</button>
      </div>
      <div class="session-list" id="sessionList"></div>
    </aside>

    <!-- Main -->
    <div class="app">
      <header>
        <button class="sidebar-toggle" onclick="toggleSidebar()" title="Toggle sidebar">☰</button>
        <div class="avatar">
          <svg class="eve" viewBox="0 0 60 80" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <radialGradient id="eveWhite" cx="35%" cy="25%" r="65%">
                <stop offset="0%" stop-color="#ffffff"/>
                <stop offset="70%" stop-color="#e8f4f8"/>
                <stop offset="100%" stop-color="#c8dde8"/>
              </radialGradient>
              <radialGradient id="eveFace" cx="50%" cy="40%" r="55%">
                <stop offset="0%" stop-color="#1a1a2e"/>
                <stop offset="100%" stop-color="#0a0a14"/>
              </radialGradient>
              <radialGradient id="eveEye" cx="30%" cy="25%" r="65%">
                <stop offset="0%" stop-color="#ffffff"/>
                <stop offset="30%" stop-color="#93c5fd"/>
                <stop offset="100%" stop-color="#1d4ed8"/>
              </radialGradient>
              <filter id="eveGlow" x="-30%" y="-30%" width="160%" height="160%">
                <feGaussianBlur stdDeviation="2" result="blur"/>
                <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
              </filter>
              <filter id="eveEyeGlow" x="-60%" y="-60%" width="220%" height="220%">
                <feGaussianBlur stdDeviation="2.5" result="blur"/>
                <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
              </filter>
              <filter id="eveShadow">
                <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#00000044"/>
              </filter>
            </defs>

            <!-- Body — tall egg, bottom heavy -->
            <ellipse class="eve-body" cx="30" cy="58" rx="16" ry="20" fill="url(#eveWhite)" filter="url(#eveGlow)"/>

            <!-- Left arm — thin curved blade -->
            <ellipse class="eve-arm-l" cx="9" cy="54" rx="4" ry="11" rx="4" ry="11"
              fill="url(#eveWhite)" filter="url(#eveShadow)"
              transform="rotate(-20 9 54)"/>

            <!-- Right arm — thin curved blade pointing out -->
            <ellipse class="eve-arm-r" cx="51" cy="52" rx="4" ry="12"
              fill="url(#eveWhite)" filter="url(#eveShadow)"
              transform="rotate(35 51 52)"/>

            <!-- Neck gap (dark) -->
            <ellipse cx="30" cy="37" rx="9" ry="3" fill="#0a0a0a"/>

            <!-- Head — round dome, white shell -->
            <ellipse class="eve-head" cx="30" cy="26" rx="16" ry="14" fill="url(#eveWhite)" filter="url(#eveGlow)"/>

            <!-- Face panel — black oval inset -->
            <ellipse cx="30" cy="28" rx="11" ry="10" fill="url(#eveFace)"/>

            <!-- Eyes — blue glowing ovals -->
            <ellipse class="eve-eye-l" cx="23" cy="27" rx="5" ry="4" fill="url(#eveEye)" filter="url(#eveEyeGlow)"/>
            <ellipse class="eve-eye-r" cx="37" cy="27" rx="5" ry="4" fill="url(#eveEye)" filter="url(#eveEyeGlow)"/>

            <!-- Eye scan lines (horizontal stripes like the image) -->
            <line x1="19" y1="25" x2="27" y2="25" stroke="#ffffff" stroke-width="0.6" opacity="0.5"/>
            <line x1="19" y1="27" x2="27" y2="27" stroke="#ffffff" stroke-width="0.6" opacity="0.5"/>
            <line x1="19" y1="29" x2="27" y2="29" stroke="#ffffff" stroke-width="0.6" opacity="0.5"/>
            <line x1="33" y1="25" x2="41" y2="25" stroke="#ffffff" stroke-width="0.6" opacity="0.5"/>
            <line x1="33" y1="27" x2="41" y2="27" stroke="#ffffff" stroke-width="0.6" opacity="0.5"/>
            <line x1="33" y1="29" x2="41" y2="29" stroke="#ffffff" stroke-width="0.6" opacity="0.5"/>

            <!-- Head shine highlight -->
            <ellipse cx="23" cy="19" rx="5" ry="3" fill="#ffffff" opacity="0.35"/>
          </svg>
        </div>
        <div class="header-info">
          <div class="name">Nyx</div>
          <div class="status"><span class="dot"></span> Your AI study buddy</div>
        </div>
      </header>

      <div class="chat-box" id="chatBox">
        <button id="scrollBtn" onclick="scrollDown()" title="Scroll to bottom">↓</button>
      </div>

      <div class="input-area">
        <!-- Hidden file input -->
        <input type="file" id="fileInput" accept=".pdf,image/*" style="display:none" onchange="handleFileUpload(event)"/>

        <!-- Attach button -->
        <button id="attachBtn" onclick="document.getElementById('fileInput').click()" title="Attach PDF or Image">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66L9.41 17.41a2 2 0 0 1-2.83-2.83l8.49-8.48"/>
          </svg>
        </button>

        <!-- File preview badge -->
        <div id="filePreview" class="file-preview" style="display:none">
          <span id="filePreviewName"></span>
          <button onclick="clearFile()" title="Remove">✕</button>
        </div>

        <textarea id="userInput" placeholder="Ask me anything about your studies..." rows="1"></textarea>

        <!-- Voice conversation button -->
        <button id="voiceBtn" onclick="openVoiceMode()" title="Voice conversation with Nyx">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
            <line x1="12" y1="19" x2="12" y2="23"/>
            <line x1="8" y1="23" x2="16" y2="23"/>
          </svg>
        </button>
        <button id="sendBtn" onclick="sendMessage()">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </div>
    </div>

    <!-- Right sidebar: quick actions -->
    <aside class="right-sidebar">
      <div class="sidebar-header">⚡ Quick Actions</div>
      <div class="quick-actions">
        <button onclick="send('Explain a concept to me')">
          <span>💡</span> Explain a concept
        </button>
        <button onclick="send('Quiz me on a topic')">
          <span>📝</span> Quiz me
        </button>
        <button onclick="send('Help me make a study plan')">
          <span>📅</span> Study plan
        </button>
        <button onclick="send('I missed a class, help me catch up')">
          <span>📖</span> Missed class
        </button>
        <button onclick="send('Summarize my notes')">
          <span>📋</span> Summarize notes
        </button>
        <button onclick="send('Give me exam tips')">
          <span>🎯</span> Exam tips
        </button>
        <button onclick="send('Help me understand a formula or theorem')">
          <span>🔢</span> Formula help
        </button>
        <button onclick="send('Give me a practice problem')">
          <span>🧩</span> Practice problem
        </button>
      </div>
    </aside>

  </div>
  <script src="app.js"></script>

  <!-- Voice Mode Modal -->
  <div id="voiceModal" class="voice-modal" style="display:none">
    <div class="voice-modal-box">
      <button class="voice-close" onclick="closeVoiceMode()">✕</button>

      <div class="voice-avatar">
        <svg class="voice-eve" viewBox="0 0 60 80" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <radialGradient id="vmWhite" cx="35%" cy="25%" r="65%">
              <stop offset="0%" stop-color="#ffffff"/>
              <stop offset="70%" stop-color="#e8f4f8"/>
              <stop offset="100%" stop-color="#c8dde8"/>
            </radialGradient>
            <radialGradient id="vmFace" cx="50%" cy="40%" r="55%">
              <stop offset="0%" stop-color="#1a1a2e"/>
              <stop offset="100%" stop-color="#0a0a14"/>
            </radialGradient>
            <radialGradient id="vmEye" cx="30%" cy="25%" r="65%">
              <stop offset="0%" stop-color="#ffffff"/>
              <stop offset="30%" stop-color="#93c5fd"/>
              <stop offset="100%" stop-color="#1d4ed8"/>
            </radialGradient>
            <filter id="vmGlow" x="-30%" y="-30%" width="160%" height="160%">
              <feGaussianBlur stdDeviation="2.5" result="blur"/>
              <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
            </filter>
            <filter id="vmEyeGlow" x="-60%" y="-60%" width="220%" height="220%">
              <feGaussianBlur stdDeviation="3" result="blur"/>
              <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
            </filter>
          </defs>
          <ellipse cx="30" cy="58" rx="16" ry="20" fill="url(#vmWhite)" filter="url(#vmGlow)"/>
          <ellipse class="vm-arm-l" cx="9" cy="54" rx="4" ry="11" fill="url(#vmWhite)" transform="rotate(-20 9 54)"/>
          <ellipse class="vm-arm-r" cx="51" cy="52" rx="4" ry="12" fill="url(#vmWhite)" transform="rotate(35 51 52)"/>
          <ellipse cx="30" cy="37" rx="9" ry="3" fill="#0a0a0a"/>
          <ellipse cx="30" cy="26" rx="16" ry="14" fill="url(#vmWhite)" filter="url(#vmGlow)"/>
          <ellipse cx="30" cy="28" rx="11" ry="10" fill="url(#vmFace)"/>
          <ellipse class="vm-eye-l" cx="23" cy="27" rx="5" ry="4" fill="url(#vmEye)" filter="url(#vmEyeGlow)"/>
          <ellipse class="vm-eye-r" cx="37" cy="27" rx="5" ry="4" fill="url(#vmEye)" filter="url(#vmEyeGlow)"/>
          <ellipse cx="23" cy="19" rx="5" ry="3" fill="#ffffff" opacity="0.35"/>
        </svg>
        <!-- Sound wave bars -->
        <div class="voice-bars" id="voiceBars">
          <span></span><span></span><span></span><span></span><span></span>
        </div>
      </div>

      <div class="voice-status" id="voiceStatus">Tap the mic to start talking</div>
      <div class="voice-transcript" id="voiceTranscript"></div>
      <div class="voice-reply" id="voiceReply"></div>

      <div class="voice-controls">
        <button id="micBtn" class="mic-btn" onclick="toggleMic()">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
            <line x1="12" y1="19" x2="12" y2="23"/>
            <line x1="8" y1="23" x2="16" y2="23"/>
          </svg>
        </button>
      </div>
      <p class="voice-hint">Nyx will listen, think, and speak back to you 🎓</p>
    </div>
  </div>
</body>
</html>
